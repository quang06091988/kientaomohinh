<style>
:root{
  --ink:#0c130f; --cream:#f6f1e4; --gold:#ffd23f;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --pad:clamp(1.25rem,5vw,3rem);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;background:var(--ink)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--ink);color:var(--cream);font:500 1rem/1.5 var(--sans);overflow-x:clip}
.in{max-width:80rem;margin:0 auto;padding-left:max(var(--pad),env(safe-area-inset-left));padding-right:max(var(--pad),env(safe-area-inset-right))}
a:focus-visible{outline:3px solid currentColor;outline-offset:5px}

/* Đầu trang: lưới bản vẽ, tiêu đề cực lớn, các đồng xu mô hình xếp so le */
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;gap:2rem;padding:calc(env(safe-area-inset-top,0px) + 1.75rem) 0 calc(env(safe-area-inset-bottom,0px) + 1.5rem);
  background-image:linear-gradient(rgba(246,241,228,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(246,241,228,.06) 1px,transparent 1px);background-size:3rem 3rem;background-position:-1px -1px}
h1{margin:0;font:800 clamp(3.7rem,19.5vw,12rem)/.9 var(--serif);letter-spacing:-.02em;word-spacing:.08em}
h1 span{display:block}
h1 span+span{margin-left:.45em}
.sub{margin:1.25rem 0 0;max-width:24rem;color:rgba(246,241,228,.75);font-size:1.05rem}
.fam{--w:56vw;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.fam li{width:var(--w);justify-self:start}
.fam li:nth-child(even){margin-left:-11vw;margin-top:14vw}
.fam li:nth-child(n+3){margin-top:-8vw}
.fam li:nth-child(n+3):nth-child(even){margin-top:6vw}
.fam li.soon{width:40vw;margin-left:5vw}
.fam a{display:block;color:var(--cream);text-decoration:none;transition:translate .25s ease}
@media (hover:hover){.fam a:hover{translate:0 -.5rem}}
.fam svg{display:block;width:100%;height:auto}
.fam b{display:block;margin-top:.6rem;text-align:center;font:600 clamp(.95rem,3.9vw,1.15rem)/1.2 var(--sans)}
.fam b span{display:block}
.fam .soon b{opacity:.7}
.cue{margin-top:auto;align-self:center;display:block;width:2.6rem;height:2.6rem;padding:.35rem;color:var(--cream);opacity:.8}
.cue svg{display:block;width:100%;height:100%}
@keyframes pop{from{opacity:0;scale:.8}to{opacity:1;scale:1}}
@keyframes bob{50%{translate:0 .4rem}}
@media (prefers-reduced-motion:no-preference){
  .fam li{animation:pop .8s cubic-bezier(.3,1.25,.5,1) both}
  .fam li:nth-child(2){animation-delay:.14s}
  .fam li:nth-child(3){animation-delay:.28s}
  .cue{animation:bob 1.8s ease-in-out infinite}
}

/* Mỗi mô hình: một dải toàn màn hình, màu và font riêng */
.band{background:var(--bg);color:var(--fg)}
.band .in{min-height:100vh;min-height:100svh;display:grid;align-content:center;gap:1.5rem;padding-top:3rem;padding-bottom:3rem;grid-template-areas:"t" "r" "b"}
.t{grid-area:t}
.band h2{margin:0;font:800 clamp(3.4rem,16.5vw,8rem)/.92 var(--f);letter-spacing:-.02em;word-spacing:.06em}
.band h2 span{display:block}
.line{margin:.8rem 0 0;font:700 clamp(1.5rem,6.2vw,2.5rem)/1.15 var(--f);color:var(--ac)}
.ring{grid-area:r;display:block;width:min(100%,34rem);height:auto;margin:0 auto;overflow:visible}
.ring text{font-family:var(--sans);font-weight:600;font-size:19px}
.btn{grid-area:b;justify-self:stretch;display:flex;align-items:center;justify-content:center;min-height:4rem;padding:.8rem 2.2rem;border-radius:var(--rad);background:var(--bb);color:var(--bf);font:800 1.35rem/1.2 var(--f);text-decoration:none;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:scale(.97)}
.band .btn:focus-visible{outline-color:var(--fg)}

/* Dải liên kết chung giữa hai trang */
.site{display:flex;flex-wrap:wrap;gap:1.5rem;margin:0 0 1.25rem;font:600 .95rem/1.2 var(--sans)}
.site a{display:inline-flex;align-items:center;min-height:2.75rem;color:rgba(246,241,228,.7);text-decoration:none;border-bottom:2px solid transparent}
.site a:hover{color:var(--cream)}
.site a[aria-current]{color:var(--cream);border-bottom-color:var(--gold)}

noscript p{padding:2rem 0;margin:0}
noscript a{color:var(--cream)}

@media (min-width:900px){
  .hero{justify-content:space-between;padding-top:calc(env(safe-area-inset-top,0px) + 3.5rem)}
  .cue{display:none}
  .fam{--w:min(24vw,22rem);display:flex;justify-content:flex-end}
  .fam li,.fam li.soon{width:var(--w)}
  .fam li:nth-child(n){margin-top:0;margin-left:0}
  .fam li:nth-child(n+2){margin-left:calc(var(--w)*-.13)}
  .fam b{font-size:1.05rem}
  .band .in{grid-template-columns:minmax(0,1fr) minmax(0,.95fr);grid-template-areas:"t r" "b r";grid-template-rows:auto auto;column-gap:4rem;row-gap:2.25rem}
  .band h2{font-size:clamp(5rem,8.4vw,8rem)}
  .t{align-self:end}
  .btn{justify-self:start;display:inline-flex;align-self:start}
  .band.flip .in{grid-template-columns:minmax(0,.95fr) minmax(0,1fr);grid-template-areas:"r t" "r b"}
  .ring{width:min(100%,38rem)}
}
</style>
</head>
<body>

<header class="hero">
  <div class="in">
    <nav class="site" aria-label="Các trang"><a href="https://kientaomohinh.vercel.app/" aria-current="page">Kẻ Kiến Tạo</a><a href="https://sangchecongcu.vercel.app/">Người Sáng Chế</a></nav>
    <h1><span>Kiến Tạo</span><span>Mô Hình</span></h1>
    <p class="sub">Những mô hình đã dựng và đang chạy thật. Cuộn xuống xem từng vòng.</p>
  </div>
  <div class="in"><ul class="fam" id="fam"></ul></div>
  <a class="cue" href="#m1" aria-label="Cuộn xuống xem các mô hình"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg></a>
</header>

<main id="models"></main>
<noscript><div class="in"><p>Cần bật JavaScript để xem đầy đủ. Các mô hình: <a href="https://diembanle.vercel.app/">Điểm Bán Lẻ</a>, <a href="https://gathavuonchuoi.vercel.app/">Gà Thả Vườn Chuối</a>.</p></div></noscript>



<script>
/* Thêm mô hình mới: copy một khối trong MODELS rồi đổi chữ, link, màu. Trang tự dựng dải màu và đồng xu.
   mid: chữ giữa vòng. split=true thì chia đôi trái/phải theo hai màu. */
var MODELS=[
{
  name:["Điểm","Bán Lẻ"],
  line:"Từ mua đến bán",
  steps:["Đặt hàng","Nhận hàng","Xem giá","Tính tiền"],
  mid:{t:["Mua","Bán"],split:true},
  url:"https://diembanle.vercel.app/",
  c:{bg:"#1b3320",fg:"#f6f1e4",a1:"#f6f1e4",a2:"#e9c46a",ac:"#e9c46a",bb:"#e9c46a",bf:"#1b3320",f:"'Fraunces',Georgia,serif",rad:".4rem"}
},
{
  name:["Gà Thả","Vườn Chuối"],
  line:"Trồng chuối nuôi gà",
  steps:["Trồng chuối","Nuôi gà","Bán xong","Không nhập"],
  mid:{t:["Tự quay","vòng"]},
  url:"https://gathavuonchuoi.vercel.app/",
  c:{bg:"#ffd23f",fg:"#0e3b2a",a1:"#0e3b2a",a2:"#b92a14",ac:"#b92a14",bb:"#0e3b2a",bf:"#fff6d6",f:"'Baloo 2','Be Vietnam Pro',system-ui,sans-serif",rad:"2rem"}
}
];

function esc(t){return String(t).replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}

/* Vòng bốn bước. disc=true: đồng xu đặc có viền; labels=true: số, tên bước và chữ giữa vòng. */
function ring(m,disc,labels,spin){
  var c=m.c,s="";
  var n=[[95,95,c.a1,10,40,"start"],[95,265,c.a1,10,336,"start"],[265,265,c.a2,350,336,"end"],[265,95,c.a2,350,40,"end"]];
  if(disc)s+='<circle cx="180" cy="180" r="174" fill="'+c.bg+'" stroke="'+c.fg+'" stroke-opacity=".4" stroke-width="4"/>';
  s+='<path d="M180 60a120 120 0 0 0 0 240" fill="none" stroke="'+c.a1+'" stroke-width="32"/>';
  s+='<path d="M180 300a120 120 0 0 0 0-240" fill="none" stroke="'+c.a2+'" stroke-width="32"/>';
  n.forEach(function(p,i){
    s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="25" fill="'+c.bg+'" stroke="'+p[2]+'" stroke-width="6"/>';
    if(labels){
      s+='<text x="'+p[0]+'" y="'+(p[1]+1)+'" text-anchor="middle" dominant-baseline="central" style="font-size:24px;font-weight:800" fill="'+p[2]+'">'+(i+1)+'</text>';
      s+='<text x="'+p[3]+'" y="'+p[4]+'" text-anchor="'+p[5]+'" fill="'+p[2]+'">'+esc(m.steps[i])+'</text>';
    }
  });
  if(labels&&m.mid){
    var t=m.mid.t,st='font-family:var(--f);font-weight:800;';
    if(m.mid.split){
      s+='<line x1="180" y1="148" x2="180" y2="212" stroke="'+c.fg+'" stroke-opacity=".35" stroke-width="2"/>';
      s+='<text x="136" y="181" text-anchor="middle" dominant-baseline="central" style="'+st+'font-size:34px" fill="'+c.a1+'">'+esc(t[0])+'</text>';
      s+='<text x="224" y="181" text-anchor="middle" dominant-baseline="central" style="'+st+'font-size:34px" fill="'+c.a2+'">'+esc(t[1])+'</text>';
    }else{
      s+='<text x="180" y="166" text-anchor="middle" dominant-baseline="central" style="'+st+'font-size:30px" fill="'+c.fg+'">'+esc(t[0])+'</text>';
      s+='<text x="180" y="198" text-anchor="middle" dominant-baseline="central" style="'+st+'font-size:30px" fill="'+c.fg+'">'+esc(t[1])+'</text>';
    }
  }
  if(spin)s+='<circle r="8" fill="'+c.fg+'" pointer-events="none"><animateMotion dur="16s" repeatCount="indefinite" path="M180 60a120 120 0 0 0 0 240a120 120 0 0 0 0-240"/></circle>';
  return s;
}

var calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
var fam=document.getElementById("fam"),main=document.getElementById("models");

MODELS.forEach(function(m,i){
  var c=m.c,id="m"+(i+1),title=m.name.join(" ");
  var li=document.createElement("li");
  li.innerHTML='<a href="#'+id+'" aria-label="Đi tới mô hình '+esc(title)+'"><svg viewBox="0 0 360 360" aria-hidden="true">'+ring(m,true,false,!calm)+'</svg><b>'+m.name.map(function(w){return '<span>'+esc(w)+'</span>'}).join("")+'</b></a>';
  fam.appendChild(li);

  var sec=document.createElement("section");
  sec.className="band"+(i%2?" flip":"");sec.id=id;
  sec.setAttribute("aria-labelledby","h-"+id);
  sec.style.cssText="--bg:"+c.bg+";--fg:"+c.fg+";--ac:"+c.ac+";--bb:"+c.bb+";--bf:"+c.bf+";--f:"+c.f+";--rad:"+c.rad;
  sec.innerHTML='<div class="in">'+
    '<div class="t"><h2 id="h-'+id+'" aria-label="'+esc(title)+'">'+m.name.map(function(w){return '<span aria-hidden="true">'+esc(w)+'</span>'}).join("")+'</h2>'+
    '<p class="line">'+esc(m.line)+'</p></div>'+
    '<svg class="ring" viewBox="0 0 360 360" role="img" aria-label="Vòng bốn bước: '+esc(m.steps.join(", "))+'">'+ring(m,false,true,!calm)+'</svg>'+
    '<a class="btn" href="'+esc(m.url)+'" target="_blank" rel="noopener" aria-label="Xem mô hình '+esc(title)+' (mở tab mới)">Xem mô hình</a></div>';
  main.appendChild(sec);
});

var soon=document.createElement("li");soon.className="soon";
soon.innerHTML='<svg viewBox="0 0 360 360" aria-hidden="true"><circle cx="180" cy="180" r="170" fill="none" stroke="#f6f1e4" stroke-opacity=".6" stroke-width="6" stroke-dasharray="14 12"/></svg><b><span>Sắp có</span></b>';
fam.appendChild(soon);
</script>
</body>
</html>
